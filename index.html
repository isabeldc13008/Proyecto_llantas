<!doctype html>
<html lang="es" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Inspección de Llantas</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
       <link rel="stylesheet" href="./style.css">
 </head>
 <body class="h-full">
  <div id="app" class="flex h-full w-full">
   <!-- Sidebar -->
   <aside class="sidebar flex flex-col">
    <div class="p-4 border-b" style="border-color:var(--border)">
     <div class="flex items-center gap-2">
      <div style="width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center">
       <i data-lucide="circle-dot" style="width:18px;height:18px;color:#fff"></i>
      </div>
      <div>
       <div id="appTitle" style="font-size:14px;font-weight:700;color:var(--text)">
        TireControl
       </div>
       <div style="font-size:10px;color:var(--text2)">
        Gestión de Llantas
       </div>
      </div>
     </div>
    </div>
    <nav class="flex-1 p-3 flex flex-col gap-1" id="sidebarNav">
     <button class="sidebar-btn active" data-view="dashboard"><i data-lucide="layout-dashboard" style="width:16px;height:16px"></i>Dashboard</button> <button class="sidebar-btn" data-view="vehicles"><i data-lucide="truck" style="width:16px;height:16px"></i>Vehículos</button> <button class="sidebar-btn" data-view="inventory"><i data-lucide="package" style="width:16px;height:16px"></i>Inventario</button> <button class="sidebar-btn" data-view="inspection"><i data-lucide="search" style="width:16px;height:16px"></i>Inspección</button> <button class="sidebar-btn" data-view="mounting"><i data-lucide="wrench" style="width:16px;height:16px"></i>Montaje</button> <button class="sidebar-btn" data-view="movements"><i data-lucide="repeat" style="width:16px;height:16px"></i>Movimientos</button> <button class="sidebar-btn" data-view="schedule"><i data-lucide="calendar" style="width:16px;height:16px"></i>Programación</button> <button class="sidebar-btn" data-view="alerts"><i data-lucide="bell" style="width:16px;height:16px"></i>Alertas</button>
    </nav>
   </aside><!-- Main -->
   <div class="main-content" id="mainContent">
    <div class="card">
     <p style="color:var(--text2)">Selecciona un módulo del menú para comenzar.</p>
    </div>
   </div>
  </div><!-- Modal container -->
  <div id="modalContainer"></div><!-- Toast container -->
  <div id="toastContainer"></div>
  <script src="./app.js"></script>
</body>
</html>
