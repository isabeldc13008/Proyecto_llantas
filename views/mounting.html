<div id="view-mounting" class="view-panel">
  <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
    <h1 style="font-size:22px;font-weight:700">Montaje / Desmontaje</h1>
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="openMountModal('montar')"><i data-lucide="arrow-up-circle" style="width:14px;height:14px"></i>Montar</button>
      <button class="btn btn-warning" onclick="openMountModal('desmontar')"><i data-lucide="arrow-down-circle" style="width:14px;height:14px"></i>Desmontar</button>
    </div>
  </div>
  <div class="card">
    <div class="overflow-x-auto">
      <table>
        <thead><tr><th>Fecha</th><th>Tipo</th><th>Placa</th><th>ID Llanta</th><th>Posición</th><th>Destino</th><th>Técnico</th><th>Notas</th></tr></thead>
        <tbody id="mountTableBody"><tr><td colspan="8" style="text-align:center;color:var(--text2)">Sin registros</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
