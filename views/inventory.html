<div id="view-inventory" class="view-panel">
  <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
    <h1 style="font-size:22px;font-weight:700">Inventario de Llantas</h1>
    <div class="flex gap-2">
      <button class="btn btn-primary" onclick="openTireModal()"><i data-lucide="plus" style="width:14px;height:14px"></i>Nueva Llanta</button>
      <button class="btn btn-secondary" onclick="openBulkModal()"><i data-lucide="upload" style="width:14px;height:14px"></i>Carga Masiva</button>
    </div>
  </div>
  <div class="card">
    <div class="flex gap-3 mb-4 flex-wrap">
      <div class="search-box flex-1" style="min-width:200px"><i data-lucide="search" style="width:16px;height:16px"></i><input type="text" id="invSearch" placeholder="Buscar ID, marca..." oninput="renderInventory()"></div>
      <select id="invFilterStatus" style="width:auto;min-width:140px" onchange="renderInventory()"><option value="">Todos los estados</option><option value="stock">En Stock</option><option value="montada">Montada</option><option value="reencauche">En Reencauche</option><option value="descarte">Descarte</option></select>
      <select id="invFilterCenter" style="width:auto;min-width:140px" onchange="renderInventory()"><option value="">Todos los centros</option></select>
    </div>
    <div class="overflow-x-auto">
      <table>
        <thead>
          <tr><th>ID</th><th>Marca</th><th>Ref</th><th>Dimensión</th><th>Reencauche</th><th>Estado</th><th>Vehículo</th><th>Centro</th><th>Acciones</th></tr>
        </thead>
        <tbody id="invTableBody"><tr><td colspan="9" style="text-align:center;color:var(--text2)">Sin llantas registradas</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
