<div id="view-schedule" class="view-panel">
  <div class="flex items-center justify-between mb-5 flex-wrap gap-3">
    <h1 style="font-size:22px;font-weight:700">Programación</h1>
    <button class="btn btn-primary" onclick="openScheduleModal()"><i data-lucide="plus" style="width:14px;height:14px"></i>Programar Inspección</button>
  </div>
  <div class="card">
    <div class="flex gap-3 mb-4 flex-wrap">
      <select id="schedFilterPriority" style="width:auto;min-width:140px" onchange="renderSchedule()"><option value="">Todas las prioridades</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select>
    </div>
    <div class="overflow-x-auto">
      <table>
        <thead><tr><th>Fecha Programada</th><th>Placa</th><th>Centro</th><th>Prioridad</th><th>Técnico</th><th>Notas</th><th>Acciones</th></tr></thead>
        <tbody id="schedTableBody"><tr><td colspan="7" style="text-align:center;color:var(--text2)">Sin programaciones</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
