<div class="data-toolbar panel" role="search"><div class="search-field"><span>⌕</span><label><b>Buscar</b><input [ngModel]="search" (ngModelChange)="searchChange.emit($event)" (keyup.enter)="apply.emit()" [placeholder]="placeholder"></label></div><label><b>Ordenar por</b><select [ngModel]="sortBy" (ngModelChange)="sortByChange.emit($event)">@for(option of sortOptions;track option.value){<option [value]="option.value">{{option.label}}</option>}</select></label><button class="apply" (click)="apply.emit()">Aplicar</button><div class="exports"><button (click)="exportCsv.emit()">CSV</button><button (click)="exportExcel.emit()">Excel</button></div></div>
<div class="advanced panel">@for(filter of filters;track filter.key){@if(filter.type==='multi'){<label><b>{{filter.label}}</b><select multiple [ngModel]="values[filter.key]||[]" (ngModelChange)="setValue(filter.key,$event)">@for(option of filter.options||[];track option.value){<option [value]="option.value">{{option.label}}</option>}</select></label>}@else{<fieldset><legend>{{filter.label}}</legend><input type="number" placeholder="Mínimo" [ngModel]="values[filter.key+'Min']" (ngModelChange)="setValue(filter.key+'Min',$event)"><input type="number" placeholder="Máximo" [ngModel]="values[filter.key+'Max']" (ngModelChange)="setValue(filter.key+'Max',$event)"></fieldset>}}<details><summary>Columnas</summary>@for(column of columns;track column.key){<label><input type="checkbox" [disabled]="column.required" [checked]="visibleColumns.includes(column.key)" (change)="toggleColumn(column.key,$any($event.target).checked)"> {{column.label}}</label>}</details><button class="clear" (click)="clear.emit()">Limpiar</button></div>
