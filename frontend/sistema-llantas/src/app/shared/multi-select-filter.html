<div class="multi" [class.open]="open()"><b>{{label}}</b><button type="button" class="trigger" [disabled]="disabled" (click)="toggle($event)" [attr.aria-expanded]="open()" aria-haspopup="listbox"><span>{{summary()}}</span><i>{{open()?'▲':'▼'}}</i></button>@if(open()){<div class="popover" (pointerdown)="$event.stopPropagation()"><header><strong>{{label}}</strong><button type="button" aria-label="Cerrar" (click)="close()">×</button></header><label class="search"><span>⌕</span><input #searchInput [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Buscar…"></label><div class="commands"><button type="button" [disabled]="loading||!!error||!filtered().length" (click)="all()">Seleccionar todos</button><button type="button" (click)="clear()">Limpiar</button></div><div class="options" role="listbox" aria-multiselectable="true">@for(option of filtered();track option.value){<label><input type="checkbox" [checked]="selected(option.value)" (change)="change(option.value,$any($event.target).checked)"><span>{{option.label}}</span></label>}@empty{<p>{{emptyMessage()}}</p>}</div><footer><span>{{values.length}} seleccionados</span><button type="button" (click)="close()">Aplicar</button></footer></div>}</div>
