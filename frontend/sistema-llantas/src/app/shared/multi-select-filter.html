<div class="multi" [class.open]="open()"><b>{{label}}</b><button type="button" class="trigger" [disabled]="disabled" (click)="toggle($event)" [attr.aria-expanded]="open()" aria-haspopup="listbox"><span>{{summary()}}</span><i>{{open()?'▲':'▼'}}</i></button>@if(open()){<div class="popover" (pointerdown)="$event.stopPropagation()"><header><strong>{{label}}</strong><button type="button" aria-label="Cerrar" (click)="close()">×</button></header><label class="search"><span>⌕</span><input #searchInput [ngModel]="search()" (ngModelChange)="searchFor($event)" placeholder="Buscar…"></label><div class="commands"><button type="button" [disabled]="loading||!!error||!filtered().length" (click)="remote&&selectAllRemote?allMatches.emit(search()):all()">{{remote&&selectAllRemote?"Seleccionar todos los resultados":remote?"Seleccionar visibles":"Seleccionar todos"}}</button><button type="button" (click)="clear()">Limpiar</button></div><div class="options" role="listbox" aria-multiselectable="true">@for(option of filtered();track option.value){<label><input type="checkbox" [checked]="allMatching||selected(option.value)" [disabled]="allMatching" (change)="change(option.value,$any($event.target).checked)"><span>{{option.label}}</span></label>}@empty{<p>{{emptyMessage()}}</p>}</div>@if(remote&&hasMore){<button type="button" [disabled]="loading" (click)="loadMore.emit()">Cargar más resultados</button>}@if(allMatching){<small>Todos los resultados seleccionados. Limpia el filtro para seleccionar valores individuales.</small>}<footer><span>{{values.length}} seleccionados</span><button type="button" (click)="close()">Aplicar</button></footer></div>}</div>
