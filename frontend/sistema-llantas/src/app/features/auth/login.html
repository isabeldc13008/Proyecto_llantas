<section class="login-page" aria-labelledby="login-title">
  <div class="landscape" aria-hidden="true">
    <svg class="contours" viewBox="0 0 560 560" fill="none" focusable="false">
      <path d="M-80 430C70 470 50 180 225 190S360 35 590 70M-80 458C95 498 70 207 235 217S382 63 590 98M-80 486C118 526 90 234 245 244S404 91 590 126M-80 514C140 554 110 261 255 271S426 119 590 154M-80 542C162 582 130 288 265 298S448 147 590 182M-80 570C184 610 150 315 275 325S470 175 590 210"/>
    </svg>
    <svg class="contours contours-secondary" viewBox="0 0 560 560" fill="none" focusable="false"><path d="M-80 430C70 470 50 180 225 190S360 35 590 70M-80 458C95 498 70 207 235 217S382 63 590 98M-80 486C118 526 90 234 245 244S404 91 590 126M-80 514C140 554 110 261 255 271S426 119 590 154M-80 542C162 582 130 288 265 298S448 147 590 182M-80 570C184 610 150 315 275 325S470 175 590 210"/></svg>
    <svg class="route" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" fill="none" focusable="false">
      <path d="M-20 620H200Q260 620 260 560V290Q260 225 325 225H840Q905 225 905 160V100Q905 65 950 65H1220"/>
      <circle cx="200" cy="620" r="7"/><circle cx="950" cy="65" r="7"/>
      <path class="route-marker" d="M880 640h24v24h-24zM892 640v24M880 648h24"/>
    </svg>
  </div>
  <div class="login-content">
    <div class="login-card">
      <header class="login-heading">
        <img class="brand-logo" src="assets/branding/logo-edinsa-2.png" alt="EDINSA" width="156" height="64">
        <p class="product-name">Sistema Llantas</p>
        <h1 id="login-title">Bienvenido</h1>
        <p class="intro">Inicia sesión para continuar</p>
      </header>
      <form (ngSubmit)="submit()" [formGroup]="form">
        <label for="login-username">Usuario</label>
        <input id="login-username" formControlName="username" autocomplete="username">
        <label for="login-password">Contraseña</label>
        <div class="password">
          <input id="login-password" [type]="showPassword?'text':'password'" formControlName="password" autocomplete="current-password">
          <button type="button" (click)="showPassword=!showPassword" [attr.aria-label]="showPassword?'Ocultar contraseña':'Mostrar contraseña'" [attr.aria-pressed]="showPassword">{{showPassword?'Ocultar':'Ver'}}</button>
        </div>
        @if(error || auth.loginError()){
          <p class="error" role="alert">{{error || auth.loginError()}}</p>
        }
        <button type="submit" class="primary login-button">Iniciar sesión <span aria-hidden="true">→</span></button>
        <small class="access-note">GLLD administra tu acceso y tus permisos.</small>
      </form>
    </div>
    <footer class="login-footer"><span class="footer-mark" aria-hidden="true"></span>Inventario · Inspecciones · Trazabilidad</footer>
  </div>
</section>
